name: Welcome New Contributors

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - name: Welcome first-time contributor
        uses: actions/github-script@v7
        with:
          script: |
            const isPR = context.eventName === 'pull_request';
            const item = isPR ? context.payload.pull_request : context.payload.issue;
            const author = item.user.login;

            // Only greet first-time contributors or external contributors
            const firstTimeRoles = ['FIRST_TIME_CONTRIBUTOR', 'FIRST_TIMER', 'NONE'];
            const isFirstTime = firstTimeRoles.includes(item.author_association);

            if (!isFirstTime) {
              console.log(`@${author} is already a recognized contributor (${item.author_association}). Skipping welcome comment.`);
              return;
            }

            let commentBody = '';

            if (isPR) {
              commentBody = `👋 Hi @${author}! Thank you for opening your first pull request on **rights.wtf**!

### 🧭 What happens next?
1. **Sources & Verification**: If this PR updates country legal data or rights status, please make sure official laws, court rulings, or authoritative NGO reports (e.g. ILGA, TGEU, HRW) are cited in your commit or description.
2. **Review**: A maintainer will review your changes and test the build shortly.
3. **Merge**: Once approved, your changes will deploy automatically to [rights.wtf](https://rights.wtf).

Thank you for helping queer people around the world know their rights! 🏳️‍🌈`;
            } else {
              commentBody = `👋 Hi @${author}! Thank you for opening your first issue on **rights.wtf**!

### 🧭 What happens next?
- **⚖️ Legal & factual corrections**: We review reports against official legislation, national gazettes, and recognized human rights monitors. If you have links or citations, please make sure they're included in the description above!
- **🐛 Bug reports & features**: A maintainer will review this shortly and follow up if we need extra reproduction details.

Thanks for helping keep **rights.wtf** accurate and reliable!`;
            }

            if (isPR) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: item.number,
                body: commentBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: item.number,
                body: commentBody,
              });
            }
