name: 🐛 Bug report
description: Report a broken page, layout issue, styling bug, or technical problem with the website.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please check if an issue for this bug already exists before filing.
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what went wrong.
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Page URL
      placeholder: https://rights.wtf/...
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can someone reproduce this behavior?
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Device & Browser
      placeholder: e.g., Safari on iOS 18, Chrome 130 on Windows 11, Firefox on Linux
  - type: textarea
    id: additional
    attributes:
      label: Screenshots or additional context
      description: Drag and drop images or add any other context here.
